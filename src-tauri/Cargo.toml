[package]
name = "qspider"
version = "1.4.0"
description = "qSpider - player for QSP games"
authors = [ "srg.kostyrko@gmail.com" ]
license = "MIT"
repository = ""
default-run = "qspider"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png", "image-ico"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.5.0", features = ["serde", "v4"] }
mime_guess = "2.0.3"
urlencoding = "2.1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
tauri-plugin-updater = "2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
