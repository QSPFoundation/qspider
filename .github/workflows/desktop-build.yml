name: Desktop build

env:
  HUSKY: 0
  CYPRESS_INSTALL_BINARY: 0

on:
  pull_request:
    # Only Rust/Tauri config can break per-OS; the frontend is built by checks.yml on every PR,
    # Linux desktop is built and tested by e2e-desktop, and scheduled-desktop-build.yml covers the rest weekly.
    paths:
      - src-tauri/**
      - .github/workflows/desktop-build.yml

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm tauri build --no-bundle ${{ matrix.args }}
