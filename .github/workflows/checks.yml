name: Checks

env:
  HUSKY: 0
  CYPRESS_INSTALL_BINARY: 0
  # Tauri build dependencies, shared by `rust`, `e2e-desktop` and `e2e-standalone-desktop` so they share one apt cache.
  TAURI_BUILD_PKGS: >-
    libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base
    gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x
    gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-pulseaudio
  # Bump to invalidate the apt cache (e.g. after a runner image update breaks a restored package).
  APT_CACHE_VERSION: 1
  # Chromium's system packages as Playwright 1.64 lists them for ubuntu24.04-x64 (its `tools` and `chromium`
  # deps), installed from the apt cache. `playwright install --with-deps` fetched them from the Azure mirror on
  # every run, and a slow mirror (24 kB/s on 2026-10-26: 12m53s) ran e2e-web past its timeout.
  # The Linux desktop E2E's WebDriver, X server and accessibility bus. A plain apt-get spent 8–10 min on one
  # package (libwebkit2gtk-4.1-0) from the Azure mirror on 2026-10-26 and ran the desktop jobs past their timeout.
  DESKTOP_E2E_PKGS: webkit2gtk-driver xvfb dbus at-spi2-core python3-gi gir1.2-atspi-2.0
  CHROMIUM_PKGS: >-
    xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable
    fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64
    libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1
    libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6
    libxfixes3 libxkbcommon0 libxrandr2

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Pinned image (not ubuntu-latest) so PR checks don't change under us when GitHub moves `latest`;
# image drift is caught by scheduled-desktop-build.yml instead.
jobs:
  # Decides whether the Rust checks and the macOS launch smoke need to run. On pull requests `rust` runs
  # only when Rust-relevant files changed, and `smoke-macos` only when desktop-relevant files changed; on
  # main both always run. A job skipped by its `if:` reports success, so `rust` stays a satisfiable
  # required check. Rust compile errors are still caught on every PR by e2e-desktop, which builds the
  # Tauri app.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src-tauri/|\.github/workflows/checks\.yml$|package\.json$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(src-tauri/|libs/desktop/|libs/tauri-storage/|apps/player-desktop/|apps/player-standalone/|apps/player-e2e/targets/smoke/|apps/player-e2e/project\.json$|apps/player-e2e/fixtures/e2e-game/|apps/player-e2e/fixtures/standalone/|apps/player-e2e/fixtures/e2e-game\.ts$|apps/player-e2e/fixtures/standalone-game\.ts$|apps/player-e2e/targets/desktop/private-env\.mjs$|apps/player-e2e/targets/desktop/private-session\.ts$|apps/player-e2e/targets/standalone/|tools/standalone-config/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/smoke-desktop\.yml$|\.github/workflows/checks\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Install Chromium's system packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.CHROMIUM_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm nx run-many -t lint typecheck test build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    # A cold apt cache on a slow mirror has taken 15+ minutes on its own; cache hits take seconds.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.TAURI_BUILD_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # Tauri's build script requires frontendDist to exist
      - run: mkdir -p dist/apps/player-desktop
      - run: pnpm check:rust

  # macOS launch smoke (smoke-desktop.yml). Required check, listed by GitHub as `smoke-macos / smoke`.
  # No `if:` here: the gate is the `run` input, so the check keeps that name when skipped (see smoke-desktop.yml).
  smoke-macos:
    needs: changes
    uses: ./.github/workflows/smoke-desktop.yml
    with:
      platform: macos
      run: ${{ needs.changes.outputs.desktop == 'true' }}

  # Windows desktop E2E (e2e-desktop-windows.yml): the main suite in N wdio shards plus the standalone suite,
  # on every PR and on main. N = 3, so each shard job stays near the ~7 min target: in run 40105883229 (all green
  # on the first attempt) the jobs took 7m04, 7m04 and 9m14 (about 2m40 of setup and build each; wdio 4m20,
  # 4m17, 6m40), standalone 5m39. N = 2 would give about 10-11 min jobs with less room for suite growth and
  # for a failing scenario's timeouts; N = 4 adds a fourth Windows build for
  # little gain. The shards are split by measured spec time (shard-timings.json, README "Shards"); that
  # imbalance came from wdio's equal-count slices. In run 40121755341 the jobs took 6m38, 6m56 and 9m43;
  # the balanced table predicts about 288 s of scenarios per shard, so the jobs should come out near
  # each other. Revisit N, or regenerate the table, when a shard job exceeds ~7 min.
  e2e-desktop-windows-main:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    uses: ./.github/workflows/e2e-desktop-windows.yml
    with:
      suite: main
      shard: ${{ matrix.shard }}

  e2e-desktop-windows-standalone:
    uses: ./.github/workflows/e2e-desktop-windows.yml
    with:
      suite: standalone

  # Windows launch smoke (smoke-desktop.yml): the main player launched with a bare positional game path, as
  # Windows passes it for "Open with". The Windows WebDriver suites launch with `--file=` (msedgedriver turns
  # plain args into Chromium switches), so this is the only Windows check of that route. Every PR, no path
  # gate, like the Windows suites; gated by the aggregate below.
  smoke-windows:
    uses: ./.github/workflows/smoke-desktop.yml
    with:
      platform: windows

  # The one required Windows check. `if: always()` so it reports even when a needed job failed or was
  # cancelled (a skipped required check would count as passing); it fails unless every needed job's result
  # is `success` (a matrix job's result is `failure` if any shard failed).
  e2e-desktop-windows:
    needs: [e2e-desktop-windows-main, e2e-desktop-windows-standalone, smoke-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every Windows job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi

  e2e-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium's system packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.CHROMIUM_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-web-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore

  e2e-standalone-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium's system packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.CHROMIUM_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e:standalone-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-standalone-web-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore

  # Linux desktop E2E: the main suite in N wdio shards, split by measured spec time (shard-timings.json,
  # README "Shards"). N = 3: unsharded, `e2e-desktop` took 12m13 in run 40121755341; the balanced table predicts
  # about 212 s of scenarios per shard, so each shard job should land at or under ~7 min (setup and build
  # included). Revisit N, or regenerate the table, when a shard job nears ~7 min. The matrix jobs are
  # named `e2e-desktop-main (i/n)`, never `e2e-desktop`: that name is the required check, reported by the
  # aggregate below.
  e2e-desktop-main:
    name: e2e-desktop-main (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.TAURI_BUILD_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # Not cached: services and tools with post-install setup, which a file-level cache may not restore.
      # Retried with network timeouts, so one dropped connection doesn't fail the job.
      - name: Install WebDriver, Xvfb and AT-SPI (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.DESKTOP_E2E_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # The cache action restores package files but runs no post-install triggers. GLib's schema compile is one of
      # them: without it WebKitWebDriver and the app abort ("Settings schema 'org.gnome.system.proxy' is not installed").
      - run: sudo glib-compile-schemas /usr/share/glib-2.0/schemas
      - run: cargo install tauri-driver --locked
      - run: pnpm e2e:desktop --shard ${{ matrix.shard }}
      # Artifact names may not contain '/': shard 1/3 becomes 1-of-3.
      - name: Artifact name
        if: failure()
        id: artifact
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "name=e2e-desktop-artifacts-${SHARD/\//-of-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore

  # The required Linux check, named `e2e-desktop` as before the shards. `if: always()` so it reports even when
  # a shard failed or was cancelled (a skipped required check would count as passing); it fails unless every
  # needed job's result is `success` (a matrix job's result is `failure` if any shard failed).
  e2e-desktop:
    needs: [e2e-desktop-main]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every Linux desktop shard succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi

  e2e-standalone-desktop:
    name: e2e-standalone-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/e2e-standalone
      - name: Install Tauri build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.TAURI_BUILD_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # Not cached: services and tools with post-install setup, which a file-level cache may not restore.
      # Retried with network timeouts, so one dropped connection doesn't fail the job.
      - name: Install WebDriver, Xvfb and AT-SPI (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.DESKTOP_E2E_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # The cache action restores package files but runs no post-install triggers. GLib's schema compile is one of
      # them: without it WebKitWebDriver and the app abort ("Settings schema 'org.gnome.system.proxy' is not installed").
      - run: sudo glib-compile-schemas /usr/share/glib-2.0/schemas
      - run: cargo install tauri-driver --locked
      - run: pnpm e2e:standalone-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-standalone-desktop-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore
