name: Checks

env:
  HUSKY: 0
  CYPRESS_INSTALL_BINARY: 0
  # Tauri build dependencies, shared by `rust`, `e2e-desktop` and `e2e-standalone-desktop` so they share one apt cache.
  TAURI_BUILD_PKGS: >-
    libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base
    gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x
    gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-pulseaudio
  # Bump to invalidate the apt cache (e.g. after a runner image update breaks a restored package).
  APT_CACHE_VERSION: 1

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Pinned image (not ubuntu-latest) so PR checks don't change under us when GitHub moves `latest`;
# image drift is caught by scheduled-desktop-build.yml instead.
jobs:
  # Decides whether the Rust checks need to run. On pull requests `rust` runs only when Rust-relevant
  # files changed; on main it always runs. A job skipped by its `if:` reports success, so `rust` stays
  # a satisfiable required check. Rust compile errors are still caught on every PR by e2e-desktop,
  # which builds the Tauri app.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src-tauri/|\.github/workflows/checks\.yml$|package\.json$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm nx run-many -t lint typecheck test build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    # A cold apt cache on a slow mirror has taken 15+ minutes on its own; cache hits take seconds.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.TAURI_BUILD_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # Tauri's build script requires frontendDist to exist
      - run: mkdir -p dist/apps/player-desktop
      - run: pnpm check:rust

  e2e-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-web-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore

  e2e-standalone-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:standalone-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-standalone-web-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore

  e2e-desktop:
    name: e2e-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.TAURI_BUILD_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # Not cached: services and tools with post-install setup, which a file-level cache may not restore.
      # Retried with network timeouts, so one dropped connection doesn't fail the job.
      - name: Install WebDriver, Xvfb and AT-SPI
        timeout-minutes: 20
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo apt-get $apt_opts update && \
               sudo apt-get $apt_opts install -y webkit2gtk-driver xvfb dbus at-spi2-core python3-gi gir1.2-atspi-2.0; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - run: cargo install tauri-driver --locked
      - run: pnpm e2e:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-desktop-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore

  e2e-standalone-desktop:
    name: e2e-standalone-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/e2e-standalone
      - name: Install Tauri build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.TAURI_BUILD_PKGS }}
          version: ${{ env.APT_CACHE_VERSION }}
      # Not cached: services and tools with post-install setup, which a file-level cache may not restore.
      # Retried with network timeouts, so one dropped connection doesn't fail the job.
      - name: Install WebDriver, Xvfb and AT-SPI
        timeout-minutes: 20
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo apt-get $apt_opts update && \
               sudo apt-get $apt_opts install -y webkit2gtk-driver xvfb dbus at-spi2-core python3-gi gir1.2-atspi-2.0; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - run: cargo install tauri-driver --locked
      - run: pnpm e2e:standalone-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-standalone-desktop-artifacts
          path: apps/player-e2e/artifacts
          if-no-files-found: ignore
