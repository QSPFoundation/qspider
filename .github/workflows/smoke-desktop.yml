name: Desktop launch smoke

# Builds the E2E debug binaries of the main desktop player and the desktop standalone player on macOS or
# Windows and checks that each one starts, opens its game and reports the start text (`pnpm smoke:desktop`,
# apps/player-e2e/targets/smoke/run-smoke.mjs). No WebDriver: the app reports markers on stdout, taken
# from game state, not from the DOM; a render failure with correct state is covered by the WebDriver suites only.
# The main player gets its game as a bare positional path, as the OS passes it for "Open with"; on Windows
# this is the only CI check of that route (the Windows WebDriver suites launch with `--file=`).
# The two smokes run as separate steps so one failure never hides the other's result.
# Called by checks.yml (macOS: desktop-relevant PRs and main; Windows: every PR and main, gated by the
# e2e-desktop-windows aggregate) and scheduled-desktop-build.yml (macOS, weekly).

env:
  HUSKY: 0
  CYPRESS_INSTALL_BINARY: 0

on:
  workflow_call:
    inputs:
      platform:
        description: Where to run the smoke (macos | windows)
        type: string
        required: true
      # The gate lives here, not on the caller: a caller job skipped by `if:` shows up as `smoke-macos`
      # (skipped), never as `smoke-macos / smoke`, so a required `smoke-macos / smoke` would wait forever.
      # With `run: false` the `smoke` job itself is skipped and reports `smoke-macos / smoke` as skipped.
      run:
        description: Run the smoke (false skips the job)
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      platform:
        description: Where to run the smoke
        type: choice
        options: [macos, windows]
        default: macos
      run:
        description: Run the smoke
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.run
    # windows-2025 is pinned as in e2e-desktop-windows.yml; macOS stays on macos-latest.
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check inputs
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            macos | windows) ;;
            *) echo "::error::platform must be 'macos' or 'windows', got '$PLATFORM'"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      # Expected to cover the standalone build's nested target dir (target/e2e-standalone) too: rust-cache
      # caches the whole `src-tauri/target` and its cleanup recurses into nested target dirs. Unverified;
      # confirm on the first run (cache size, standalone build incremental on a warm cache).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The runner refuses to run in a host session off Linux unless CI is set; GitHub Actions sets CI=true.
      - name: Launch smoke (main player)
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          mkdir -p apps/player-e2e/artifacts/smoke
          set -o pipefail
          pnpm nx run player-e2e:smoke-desktop --output-style=static 2>&1 | tee "apps/player-e2e/artifacts/smoke/smoke-$PLATFORM-main.log"
      - name: Launch smoke (standalone)
        if: success() || failure()
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          mkdir -p apps/player-e2e/artifacts/smoke
          set -o pipefail
          pnpm nx run player-e2e:smoke-desktop-standalone --output-style=static 2>&1 | tee "apps/player-e2e/artifacts/smoke/smoke-$PLATFORM-standalone.log"
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: smoke-${{ inputs.platform }}-artifacts
          path: apps/player-e2e/artifacts/smoke
          if-no-files-found: ignore
