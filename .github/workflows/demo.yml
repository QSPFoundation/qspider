name: Demo player update

env:
  HUSKY: 0

on: workflow_dispatch

jobs:
  publish-demo:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Fill updater files
        uses: actions/github-script@v7
        env:
          # Release tag whose latest.json feeds the frozen v1 updater endpoint (updater.json).
          # While empty, updater.json mirrors the latest release (pre-bridge behavior).
          # Once set, it must only ever change to a fixed bridge release that is also v1Compatible.
          BRIDGE_RELEASE_TAG: ''
        with:
          script: |
            const { createWriteStream }  = require("node:fs");
            const { pipeline } = require("node:stream/promises");

            const downloadLatestJson = async (release, outputPath) => {
              const latestAsset = release.data.assets.find(asset => asset.name === 'latest.json');
              if (!latestAsset) {
                throw new Error(`latest.json not found in release ${release.data.tag_name}`);
              }
              const assetContent = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: latestAsset.id,
                headers: {
                  accept: "application/octet-stream",
                },
                request: {
                  parseSuccessResponseBody: false, // required to access response as stream
                },
              });
              await pipeline(assetContent.data, createWriteStream(outputPath));
            };

            const latestRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            await downloadLatestJson(latestRelease, "./dist/apps/player/updater-v2.json");

            const bridgeTag = process.env.BRIDGE_RELEASE_TAG;
            const v1Release = bridgeTag
              ? await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: bridgeTag
                })
              : latestRelease;
            await downloadLatestJson(v1Release, "./dist/apps/player/updater.json");

            if (!bridgeTag) {
              const { readFileSync } = require("node:fs");
              const manifest = JSON.parse(readFileSync("./dist/apps/player/updater.json", "utf8"));
              const bad = Object.entries(manifest.platforms ?? {}).filter(
                ([, platform]) => !/\.(zip|tar\.gz)$/.test(platform.url)
              );
              if (bad.length > 0) {
                throw new Error(
                  `Latest release ${latestRelease.data.tag_name} is a v2-format release (` +
                  `${bad.map(([name, platform]) => `${name}: ${platform.url}`).join(", ")}). ` +
                  `Refusing to write it to the frozen updater.json: set BRIDGE_RELEASE_TAG to the bridge release tag.`
                );
              }
            }
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/apps/player
          clean: true
          clean-exclude: |
            .nojekyll
