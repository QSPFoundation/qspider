# The standalone fixture: staged into the standalone build's game/ folder (targets/standalone/stage-public.ts).
# Two games: the standalone player starts only the first one.

[[game]]
id = "standalone-game"
title = "Standalone game"
# A dot segment: the desktop player must resolve it (read_app_asset gets a normalised URL).
file = "./standalone.qsps"
themes = ["e2e-theme.html"]
defaultTheme = "e2e-custom"

[game.resources]
styles = ["css/standalone.css"]
scripts = ["js/standalone.js"]

[[game]]
id = "standalone-other"
title = "Standalone other"
file = "other.qsps"
