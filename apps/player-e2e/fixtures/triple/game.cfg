# Source of the triple-game archive: three games reusing the single, aero and second fixtures' .qsps files
# (build-fixtures.ts packs each in its own folder:
# games sharing the folder of the game.cfg would all take the first entry's id and title on import).
# Titles and ids differ from the test pack's, so the games stay unique on a shelf that already holds
# the pack (desktop launches with it).

[[game]]
id = "triple-one"
title = "Triple alpha"
file = "one/single.qsps"

[[game]]
id = "triple-two"
title = "Triple beta"
file = "two/aero-game.qsps"

[[game]]
id = "triple-three"
title = "Triple gamma"
file = "three/game.qsps"
