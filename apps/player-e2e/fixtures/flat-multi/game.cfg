# Source of the flat multi-game archive: three games reusing the single, aero and second fixtures' .qsps files,
# all packed in the same folder as this game.cfg (build-fixtures.ts). Titles and ids differ from the other
# fixtures', so the games stay unique on a shelf that already holds the test pack.

[[game]]
id = "flat-one"
title = "Flat alpha"
file = "single.qsps"

[[game]]
id = "flat-two"
title = "Flat beta"
file = "aero-game.qsps"

[[game]]
id = "flat-three"
title = "Flat gamma"
file = "game.qsps"
