# The E2E test pack: both targets load it (desktop launches with this file, web uploads it zipped).
# e2e-game.qsps sits in its own folder, away from this file: the desktop player titles a single
# game file from a game.cfg next to it, and single-file opens must show the file name on both targets.

[[game]]
id = "e2e-game"
title = "E2E game"
file = "e2e-game/e2e-game.qsps"

[[game]]
id = "e2e-second-game"
title = "Second game"
file = "second/game.qsps"
