# Source of externalThemeZip: the game's theme is a file on the asset server, named by an absolute http URL.
# Keep the URL in sync with ASSET_SERVER (guarded in build-fixtures.spec.ts).

[[game]]
id = "external-theme"
title = "External theme game"
file = "external-theme.qsps"
themes = ["http://127.0.0.1:47631/ext-theme.html"]
defaultTheme = "e2e-ext"
